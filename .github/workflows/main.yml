name: Build Android TV APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Compile App Elements
        run: |
          # 1. Create structure and move Java file
          mkdir -p com/mysite/tvapp
          cp MainActivity.java com/mysite/tvapp/
          
          # 2. Compile Java using the exact platform library path
          javac -cp $ANDROID_HOME/platforms/android-34/android.jar -d . com/mysite/tvapp/MainActivity.java
          
          # 3. Corrected d8 compilation syntax for Ubuntu cloud runner
          $ANDROID_HOME/build-tools/34.0.0/d8 --output . com/mysite/tvapp/MainActivity.class
          
          # 4. Package resources into the APK layout structure
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M AndroidManifest.xml -I $ANDROID_HOME/platforms/android-34/android.jar -F unsigned.apk
          
          # 5. Inject the bytecode into the archive
          zip -g unsigned.apk classes.dex

      - name: Sign APK Pack
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --out tv_app.apk unsigned.apk

      - name: Upload Finished TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-APK
          path: tv_app.apk
